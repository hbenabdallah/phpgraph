min_recall: 0.75
min_precision: 0.7
checked: |
  Read in the code: CoreBundle/Resources/config/services/order_processing.php registers OrderPromotionProcessor as a
  sylius.order_processor (priority 20); it calls PromotionProcessorInterface::process(), PromotionProcessor
  (PromotionBundle services.php: sylius.processor.promotion). PromotionProcessor reverts the order's promotions
  through PromotionApplicator, asks PreQualifiedPromotionsProviderInterface for candidates (ActivePromotionsProvider,
  ActivePromotionsByChannelProvider), checks each with PromotionEligibilityCheckerInterface (composite; the rules part
  is PromotionRulesEligibilityChecker, which runs a RuleCheckerInterface per rule from a registry) and applies the
  eligible ones, exclusive first. PromotionApplicator runs a PromotionActionCommandInterface per action (registry by
  type). The allowed list: every class of the directories read (Promotion Checker/Eligibility, Checker/Rule,
  Provider, Action, Processor; Core Promotion/Action, Checker/Rule, Applicator, Distributor), the models touched
  and the registry, FQCN from each file's namespace line.
