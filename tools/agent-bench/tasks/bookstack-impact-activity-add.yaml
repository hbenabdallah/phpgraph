checked: |
  ActivityLogger is bound as 'activity' (App/Providers/AppServiceProvider.php:38) and exposed by the facade
  BookStack\Facades\Activity (@mixin ActivityLogger). grep -rln "Activity::add(" app routes tests: 20 files (16 in
  app, 4 tests), among them Http\Controller::logActivity(), the wrapper the controllers call (its callers pass
  through it and need no change). Direct calls on an instance resolved from the container: tests AuditLogTest
  ($this->activityService->add, lines 47, 62, 77), WatchTest (371, 406), WebhookCallTest (148). No other class
  receives an ActivityLogger (grep ActivityLogger app tests). Recall 0.9: two of 24 classes may be missed.
