name: Edge

# Every push to main publishes its PHAR and executables as the pre-release "edge": what install.sh installs for
# dev-main. "edge" is not a version: Packagist skips the tag, and releases/latest never points to a pre-release.
# The tag moves with main, unlike version tags, which must never move.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/binaries.yml
    with:
      version: dev-main

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phpgraph*
          path: dist
          merge-multiple: true
      # A platform whose binary failed is left out; nothing is published without the PHAR, which runs the checks.
      - run: test -f dist/phpgraph.phar && ls dist
      - name: Replace the edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # GitHub's API fails now and then (503): each step is tried again, and nothing is created while the old one stays.
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release view edge >/dev/null 2>&1; then
              gh release delete edge --cleanup-tag --yes || { sleep 20; continue; }
            fi
            if gh release create edge dist/* --prerelease --target "$GITHUB_SHA" --title "dev-main" \
              --notes "Built from main at $GITHUB_SHA. Not a release: install a version for production use."; then
              published=1
              break
            fi
            sleep 20
          done
          test -n "${published:-}"
      # gh reuses an existing tag and ignores --target: when the old tag could not be deleted (a tag ruleset refuses it,
      # "Cannot delete this tag" above), the release is published on the old commit and nothing else fails.
      - name: Check that the edge tag moved to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tagged=$(gh api "repos/$GH_REPO/commits/edge" --jq .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The edge tag points to $tagged, not $GITHUB_SHA: exclude refs/tags/edge from the repository's tag ruleset."
            exit 1
          fi
