name: Release

# Publishes a release when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0):
# - the PHAR and its checksum, attached to a GitHub release (download counts on the release page);
# - executables needing no PHP, for Linux and macOS (x86_64, aarch64) and Windows (x86_64), with their checksums,
#   attached to the same release (built by binaries.yml);
# - the Docker image ghcr.io/<owner>/phpgraph, for amd64 and arm64 (pull counts on the package page).
# Packagist follows the tags by itself once the package is submitted there.
#
# A release whose publication failed is published again from the Actions tab (Run workflow, with its tag): the code
# of the tag, built by the workflows of main. Version tags never move.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish again (v0.1.4)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Only phpgraph's: the Docker job leaves a build record artifact too.
      - uses: actions/download-artifact@v4
        with:
          pattern: phpgraph*
          path: dist
          merge-multiple: true
      # A platform whose binary failed is left out; nothing is published without the PHAR, which runs the checks.
      - run: test -f dist/phpgraph.phar && ls dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  # Published on the tag push only: an image is never rebuilt for a release published again.
  docker:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/phpgraph
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PHPGRAPH_VERSION=${{ github.ref_name }}
